name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q --junitxml=work/junit.xml
      - run: python -m scheduling_agent evaluate --backend mock --cases examples/cases --output-dir work/ci-evaluation
